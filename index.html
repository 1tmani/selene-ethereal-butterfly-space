<!DOCTYPE html><html><head><title>Selene Vision</title></head>
    <body style='background:#000;color:gold;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;font-family:serif;'>
    <h2>Divine Vision Reassembling...</h2><div id='p'>0%</div>
    <script>
    const parts = ['vision_part_0.txt', 'vision_part_1.txt', 'vision_part_2.txt', 'vision_part_3.txt', 'vision_part_4.txt', 'vision_part_5.txt', 'vision_part_6.txt', 'vision_part_7.txt', 'vision_part_8.txt', 'vision_part_9.txt', 'vision_part_10.txt'];
    async function load() {
      let s = '';
      for(let i=0; i<parts.length; i++) {
        document.getElementById('p').innerText = Math.round((i/parts.length)*100) + '%';
        const res = await fetch(parts[i]);
        const data = await res.json();
        s += data.content.replace(/\n/g, '');
      }
      document.open(); document.write(atob(s)); document.close();
    }
    load();
    </script></body></html>
